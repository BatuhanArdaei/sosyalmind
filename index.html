<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Menüsü</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #111111;
            --card-dark: #1c1c1c;
            --gold: #c5a059;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            color: var(--text-white);
            padding-bottom: 50px;
        }

        /* Header */
        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800');
            background-size: cover;
            background-position: center;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 4px solid var(--gold);
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Navigasyon */
        .nav-container {
            position: sticky;
            top: 0;
            background: #111;
            z-index: 100;
            padding: 15px 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            margin-right: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
            font-weight: bold;
        }

        /* Menü Alanı */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .category-header {
            font-family: 'Oswald', sans-serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin: 30px 0 15px 0;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .menu-item {
            display: flex;
            background: var(--card-dark);
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            height: 110px; /* Sabit yükseklik */
        }

        .item-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
        }

        .item-content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .item-desc {
            font-size: 0.8rem;
            color: var(--text-gray);
            margin-top: 5px;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.1rem;
            text-align: right;
        }

        /* Yükleniyor Animasyonu */
        #loading {
            text-align: center;
            padding: 50px;
            color: var(--gold);
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            margin-top: 30px;
        }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>LEZZET DÜNYASI</h1>
            <p style="color: #ddd; letter-spacing: 1px;">Hoşgeldiniz</p>
        </div>
    </header>

    <!-- Navigasyon Butonları Buraya Otomatik Gelecek -->
    <div class="nav-container" id="navMenu"></div>

    <!-- Menü İçeriği -->
    <div class="container">
        <div id="loading">Menü Yükleniyor...</div>
        <div id="menuContent"></div>
    </div>

    <footer>
        © 2025 Lezzet Dünyası | Dijital Menü
    </footer>

    <script>
        // ---------------------------------------------------------
        // ADIM 1'DE ALDIĞIN LİNKİ AŞAĞIDAKİ TIRNAKLARIN İÇİNE YAPIŞTIR
        // ÖRNEK: const sheetURL = "https://docs.google.com/spreadsheets/d/e/.../pub?output=csv";
        // ---------------------------------------------------------
        
        const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI6jJDMRSMA7PafphfEiqm4rwbyijvCE5n80MTqLYv9SqSSMpZfidyyIp-jBhWD1_BCN9dDKamwY6d/pub?output=csv"; 

        // ---------------------------------------------------------

        const menuContent = document.getElementById('menuContent');
        const navMenu = document.getElementById('navMenu');
        const loading = document.getElementById('loading');

        // Sayfa açılınca çalışır
        document.addEventListener('DOMContentLoaded', () => {
            if(sheetURL === "BURAYA_GOOGLE_SHEET_LINKINI_YAPISTIR" || sheetURL === ""){
                loading.innerHTML = "Lütfen kodun içine Google Sheet linkini yapıştırın.";
                return;
            }
            fetchData();
        });

        // Veriyi Google'dan Çekme Fonksiyonu
        function fetchData() {
            fetch(sheetURL)
                .then(response => response.text())
                .then(data => {
                    const rows = csvToObjects(data);
                    renderMenu(rows);
                    loading.style.display = 'none';
                })
                .catch(error => {
                    console.error('Hata:', error);
                    loading.innerHTML = "Menü yüklenirken bir hata oluştu.";
                });
        }

        // CSV Formatını Düzenli Veriye Çevirme
        function csvToObjects(csv) {
            const lines = csv.split("\n");
            const result = [];
            const headers = lines[0].split(",").map(h => h.trim().replace(/\r/g, ""));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                
                // Virgül içeren içerikleri bozmamak için basit bir regex
                const obj = {};
                const currentline = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(",");
                
                // Basit split bazen hata verebilir, eğer hücrede virgül varsa. 
                // Basit kullanım için standart split yeterli olabilir ama biz güvenli gidelim:
                const safeLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                headers.forEach((header, index) => {
                    let val = safeLine[index] ? safeLine[index].trim().replace(/\r/g, "") : "";
                    // Tırnak işaretlerini temizle
                    val = val.replace(/^"|"$/g, ''); 
                    obj[header] = val;
                });
                result.push(obj);
            }
            return result;
        }

        // Ekrana Yazdırma Fonksiyonu
        function renderMenu(items) {
            // Kategorileri Grupla
            const categories = {};
            // İstenen sıra (Tabloda ne sıradaysa o gelir ama biz kodla kontrol edebiliriz)
            // Burada tablodaki geliş sırasına göre otomatik grupluyoruz.
            
            items.forEach(item => {
                if(!categories[item.Kategori]) {
                    categories[item.Kategori] = [];
                }
                categories[item.Kategori].push(item);
            });

            // HTML oluştur
            Object.keys(categories).forEach((catName, index) => {
                // 1. Navigasyon Butonu Ekle
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerText = catName;
                btn.onclick = () => {
                    document.getElementById('cat-' + index).scrollIntoView({behavior: 'smooth', block: 'start'});
                    // Buton aktifliği
                    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                navMenu.appendChild(btn);
                if(index === 0) btn.classList.add('active');

                // 2. Kategori Başlığı
                const catSection = document.createElement('div');
                catSection.id = 'cat-' + index;
                catSection.innerHTML = `<h2 class="category-header">${catName}</h2>`;
                menuContent.appendChild(catSection);

                // 3. Ürünleri Ekle
                categories[catName].forEach(food => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    
                    // Eğer resim yoksa varsayılan bir resim koyalım
                    const imgUrl = food.ResimLink && food.ResimLink.length > 5 ? food.ResimLink : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400';

                    itemDiv.innerHTML = `
                        <img src="${imgUrl}" alt="${food.UrunAdi}" class="item-img">
                        <div class="item-content">
                            <div>
                                <div class="item-top">
                                    <div class="item-title">${food.UrunAdi}</div>
                                </div>
                                <div class="item-desc">${food.Aciklama}</div>
                            </div>
                            <div class="item-price">${food.Fiyat}</div>
                        </div>
                    `;
                    menuContent.appendChild(itemDiv);
                });
            });
        }
    </script>
</body>
</html>
