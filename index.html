<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ertaş Pide & Kebap Salonu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #d4af37;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --glass: rgba(20, 20, 20, 0.85);
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background-color: var(--bg-color); color: var(--text-main); font-family: 'DM Sans', sans-serif; padding-bottom: 80px;
        }

        /* HEADER */
        .glass-header {
            position: sticky; top: 0; z-index: 1000; background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand-name { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .brand-name span { color: var(--accent); }

        .settings-group { display: flex; gap: 8px; }
        .toggle-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.05);
            color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 0.8rem;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: 'DM Sans', sans-serif;
        }
        .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* ARAMA */
        .search-wrapper { position: relative; }
        .search-input {
            width: 100%; background: #252525; border: 1px solid rgba(255,255,255,0.05);
            padding: 14px 20px 14px 45px; border-radius: 16px; color: white; font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .search-input:focus { background: #2a2a2a; border-color: var(--accent); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

        /* CONTAINER */
        .container { padding: 25px 20px; max-width: 800px; margin: 0 auto; }

        /* GRID VIEW */
        .grid-view { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .cat-card {
            position: relative; background: var(--card-bg); border-radius: var(--radius);
            overflow: hidden; aspect-ratio: 1 / 1.15; cursor: pointer; transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .cat-card:active { transform: scale(0.97); }
        .cat-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.75; transition: 0.5s; }
        .cat-card:hover .cat-img { opacity: 0.6; transform: scale(1.05); }
        .cat-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }
        .cat-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .cat-count { font-size: 0.75rem; color: rgba(255,255,255,0.7); }

        /* LIST VIEW */
        .list-view { display: none; animation: slideUp 0.5s cubic-bezier(0.2, 1, 0.3, 1); }
        .nav-back { display: flex; align-items: center; margin-bottom: 25px; cursor: pointer; color: var(--text-sub); }
        .nav-back i { font-size: 1.2rem; margin-right: 10px; color: var(--accent); }
        .nav-title { font-size: 1.5rem; font-weight: 700; color: #fff; margin-left: auto; }

        .menu-item {
            background: var(--card-bg); border-radius: 20px; padding: 12px;
            margin-bottom: 12px; display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.03);
        }
        .item-img { width: 95px; height: 95px; border-radius: 16px; object-fit: cover; background: #000; }
        .item-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 0; }
        .item-name { font-size: 1rem; font-weight: 700; color: #fff; line-height: 1.3; }
        .item-desc { 
            font-size: 0.8rem; color: var(--text-sub); margin-top: 5px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .item-price { font-size: 1.15rem; font-weight: 700; color: var(--accent); align-self: flex-end; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        #loading { text-align: center; margin-top: 50px; color: var(--accent); }
    </style>
</head>
<body>

    <div class="glass-header">
        <div class="header-top">
            <div class="brand-name">Ertaş Pide <span>& Kebap Salonu</span></div>
            <div class="settings-group">
                <button class="toggle-btn" id="langBtn" onclick="toggleLang()">TR</button>
                <button class="toggle-btn" id="currencyBtn" onclick="toggleCurrency()">₺</button>
            </div>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Arama yapın...">
        </div>
    </div>

    <div class="container">
        <div id="loading">Menü Hazırlanıyor...</div>
        <div id="gridView" class="grid-view"></div>
        <div id="listView" class="list-view">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                <span id="backText">Menüye Dön</span>
                <span class="nav-title" id="pageTitle"></span>
            </div>
            <div id="productsContainer"></div>
        </div>
    </div>

    <script>
        // =============================================================
        // LİNKLER (İKİ AYRI TABLO)
        // =============================================================
        
        // 1. ANA TABLO (TL, İsimler, Fotolar)
        const linkTL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrIczjBfOYYZlHTC17u2iLnfk1aki4U9VG-E66uxiOB0CtCPJYo_hYOdgxKLbvMl8o6cc_7eUuqr8A/pub?output=csv";
        
        // 2. EURO TABLOSU (Sadece İsim ve Euro Fiyatı)
        const linkEUR = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrIczjBfOYYZlHTC17u2iLnfk1aki4U9VG-E66uxiOB0CtCPJYo_hYOdgxKLbvMl8o6cc_7eUuqr8A/pub?output=csv";

        // =============================================================

        let state = {
            lang: 'TR', currency: 'TL',
            data: [], grouped: {}, activeCat: null, view: 'grid'
        };

        const textRes = {
            TR: { search: "Arama yapın...", back: "Menüye Dön", unit: "Çeşit" },
            EN: { search: "Search menu...", back: "Back to Menu", unit: "Items" }
        };

        // İki tabloyu aynı anda çekip birleştirme
        document.addEventListener('DOMContentLoaded', () => {
            Promise.all([
                fetch(linkTL).then(r => r.text()),
                fetch(linkEUR).then(r => r.text())
            ]).then(([csvTL, csvEUR]) => {
                
                const dataTL = csvToObjects(csvTL);
                const dataEUR = csvToObjects(csvEUR);
                
                // VERİLERİ BİRLEŞTİR (MERGE)
                state.data = mergeData(dataTL, dataEUR);
                
                groupData();
                renderGrid();
                document.getElementById('loading').style.display = 'none';
                updateUI();

            }).catch(err => {
                document.getElementById('loading').innerText = "Hata: Veriler alınamadı. İnternet bağlantınızı kontrol edin.";
                console.error(err);
            });
        });

        // BİRLEŞTİRME FONKSİYONU
        function mergeData(mainList, euroList) {
            return mainList.map(item => {
                // İsimleri eşleştirirken boşlukları temizle ve küçült (Hata payını azaltmak için)
                const safeName = item.UrunAdi ? item.UrunAdi.trim().toLowerCase() : "";
                
                // Euro listesinde bu ürünü bul
                const euroMatch = euroList.find(e => 
                    (e.UrunAdi && e.UrunAdi.trim().toLowerCase() === safeName)
                );

                // Euro fiyatını ekle (Yoksa boş bırak)
                item.Fiyat_EUR = euroMatch ? euroMatch.Fiyat : "";
                
                // Ana fiyatı Fiyat_TL olarak kaydet
                item.Fiyat_TL = item.Fiyat; 

                return item;
            });
        }

        function groupData() {
            state.grouped = {};
            state.data.forEach(item => {
                if(!item.Kategori) return;
                if(!state.grouped[item.Kategori]) state.grouped[item.Kategori] = [];
                state.grouped[item.Kategori].push(item);
            });
        }

        // --- RENDER ---
        function renderGrid() {
            const grid = document.getElementById('gridView');
            grid.innerHTML = "";
            
            Object.keys(state.grouped).forEach(catKey => {
                const items = state.grouped[catKey];
                let cover = "https://placehold.co/400x400/1f1f1f/d4af37?text=" + catKey;
                const imgItem = items.find(i => i.ResimLink && i.ResimLink.length > 10);
                if(imgItem) cover = imgItem.ResimLink;

                let name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : catKey;

                const div = document.createElement('div');
                div.className = 'cat-card';
                div.onclick = () => openCategory(catKey);
                div.innerHTML = `
                    <img src="${cover}" class="cat-img" loading="lazy">
                    <div class="cat-info">
                        <div class="cat-title">${name}</div>
                        <div class="cat-count">${items.length} ${textRes[state.lang].unit}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function renderList(items) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = "";

            if(!items || items.length === 0) {
                container.innerHTML = `<div style="text-align:center;color:#666;margin-top:20px;">Ürün bulunamadı.</div>`;
                return;
            }

            items.forEach(food => {
                // Dil
                let name = (state.lang === 'EN' && food.UrunAdi_EN) ? food.UrunAdi_EN : food.UrunAdi;
                let desc = (state.lang === 'EN' && food.Aciklama_EN) ? food.Aciklama_EN : food.Aciklama;

                // Fiyat
                let priceDisplay = "";
                if(state.currency === 'TL') {
                    priceDisplay = food.Fiyat_TL ? `${food.Fiyat_TL} ₺` : "-";
                } else {
                    priceDisplay = food.Fiyat_EUR ? `${food.Fiyat_EUR} €` : "-";
                }

                let img = (food.ResimLink && food.ResimLink.length > 10) ? food.ResimLink : "https://placehold.co/150x150/222/d4af37?text=Ertaş";

                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <img src="${img}" class="item-img" loading="lazy">
                    <div class="item-details">
                        <div>
                            <div class="item-name">${name}</div>
                            <div class="item-desc">${desc}</div>
                        </div>
                        <div class="item-price">${priceDisplay}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- ETKİLEŞİM ---
        function openCategory(catKey) {
            state.activeCat = catKey;
            state.view = 'list';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            
            let items = state.grouped[catKey];
            let name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : catKey;
            document.getElementById('pageTitle').innerText = name;

            renderList(items);
            window.scrollTo(0,0);
            document.getElementById('searchInput').value = "";
        }

        function goBack() {
            state.activeCat = null;
            state.view = 'grid';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('gridView').style.display = 'grid';
            document.getElementById('searchInput').value = "";
            renderGrid();
        }

        function toggleLang() {
            state.lang = (state.lang === 'TR') ? 'EN' : 'TR';
            updateUI();
            refreshCurrentView();
        }

        function toggleCurrency() {
            state.currency = (state.currency === 'TL') ? 'EUR' : 'TL';
            updateUI();
            refreshCurrentView();
        }

        function updateUI() {
            const lBtn = document.getElementById('langBtn');
            const cBtn = document.getElementById('currencyBtn');
            lBtn.innerText = state.lang;
            cBtn.innerText = (state.currency === 'TL') ? '₺' : '€';
            lBtn.classList.toggle('active', state.lang === 'EN');
            cBtn.classList.toggle('active', state.currency === 'EUR');
            document.getElementById('searchInput').placeholder = textRes[state.lang].search;
            document.getElementById('backText').innerText = textRes[state.lang].back;
        }

        function refreshCurrentView() {
            if(state.view === 'grid') renderGrid();
            else if(state.view === 'list') {
                let items = state.grouped[state.activeCat];
                let name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : state.activeCat;
                document.getElementById('pageTitle').innerText = name;
                renderList(items);
            } else if(state.view === 'search') {
                document.getElementById('searchInput').dispatchEvent(new Event('keyup'));
            }
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            if(term.length === 0) {
                if(state.activeCat) openCategory(state.activeCat);
                else goBack();
                return;
            }
            state.view = 'search';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.getElementById('pageTitle').innerText = (state.lang === 'TR') ? "Sonuçlar" : "Results";
            
            let results = [];
            state.data.forEach(item => {
                let fullText = `${item.UrunAdi} ${item.Aciklama} ${item.UrunAdi_EN || ''} ${item.Aciklama_EN || ''}`.toLowerCase();
                if(fullText.includes(term)) results.push(item);
            });
            renderList(results);
        });

        function csvToObjects(csv) {
            const lines = csv.split("\n");
            const headers = lines[0].split(",").map(h => h.trim().replace(/[\r"]/g, ""));
            const result = [];
            for(let i=1; i<lines.length; i++){
                if(!lines[i]) continue;
                const currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const obj = {};
                headers.forEach((h, j) => {
                    obj[h] = currentline[j] ? currentline[j].replace(/[\r"]/g, "") : "";
                });
                result.push(obj);
            }
            return result;
        }
    </script>
</body>
</html>
