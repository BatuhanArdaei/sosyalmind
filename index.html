<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ertaş Pide & Kebap | Deluxe</title>
    
    <!-- FONTLAR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- İKONLAR -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #FF3B3B; 
            --bg-deep: #050505;
            --text-white: #FFFFFF;
            --text-muted: #9CA3AF;
            --border-glass: rgba(255, 255, 255, 0.1);
            --radius: 20px;
        }

        /* Kutu Modeli */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; padding-bottom: 140px;
            -webkit-user-select: none; user-select: none;
        }

        /* ARKA PLAN */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover; background-position: center; opacity: 0.15; filter: blur(8px); z-index: -10;
        }

        /* --- YENİ SİSLİ LOADER --- */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 99999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        /* SİS EFEKTİ (Vignette) */
        #preloader::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, 
                rgba(0,0,0,0) 0%, 
                rgba(0,0,0,0.4) 20%, 
                rgba(0,0,0,0.9) 50%, 
                #000000 100%
            );
            pointer-events: none;
            z-index: 2;
        }

        #preloader.loader-hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        /* Video Ayarları */
        #preloader video {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
        }
        #preloader video::-webkit-media-controls { display: none !important; }

        /* --- HEADER --- */
        .cinematic-header {
            position: sticky; top: 0; z-index: 900; 
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px; border-bottom: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .brand-logo { 
            font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; 
            color: #fff; text-transform: uppercase; letter-spacing: -0.5px; flex: 1;
        }
        .brand-logo span { color: var(--primary); }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .ctrl-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border-glass); 
            color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 0.75rem; 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-family: 'Outfit', sans-serif;
            min-width: 40px; display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn.active { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 59, 59, 0.4); }

        .search-trigger {
            background: transparent; border: none; color: #fff; font-size: 1.2rem;
            cursor: pointer; padding: 8px; transition: 0.3s;
        }

        /* --- ARAMA POPUP --- */
        .search-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 2000;
            display: flex; flex-direction: column; padding: 20px;
            opacity: 0; visibility: hidden; transition: 0.3s;
            transform: translateY(-20px);
            box-sizing: border-box;
        }
        .search-overlay.active { opacity: 1; visibility: visible; transform: translateY(0); }
        
        .search-header { display: flex; justify-content: flex-end; margin-bottom: 20px; width: 100%; }
        .close-search { color: #fff; font-size: 1.8rem; background: none; border: none; cursor: pointer; padding: 10px; }
        
        .search-input {
            width: 100%; background: #1a1a1a; border: 1px solid #333;
            padding: 18px 20px; border-radius: 16px; color: #fff; font-size: 1.1rem; 
            font-family: 'Inter', sans-serif; outline: none; margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(255, 59, 59, 0.2); }
        
        .search-results-area { flex: 1; overflow-y: auto; width: 100%; }

        /* --- CONTENT --- */
        .content-area { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        .grid-layout { 
            display: grid; gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
        }

        /* --- KART YAPISI --- */
        .card-base {
            position: relative; border-radius: var(--radius); overflow: hidden;
            cursor: pointer; border: 1px solid var(--border-glass);
            background: #111; aspect-ratio: 4 / 5 !important; width: 100%;
            display: flex; flex-direction: column; justify-content: flex-end;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-base:active { transform: scale(0.96); }

        .card-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: transform 0.6s ease; filter: brightness(0.8); z-index: 0;
            pointer-events: none;
        }
        .card-base:hover .card-img { transform: scale(1.05); filter: brightness(1); }

        .card-overlay {
            position: relative; z-index: 1;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 30%, rgba(0,0,0,0) 100%);
            padding: 20px 15px 15px 15px; width: 100%;
        }

        .card-title {
            font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: #fff;
            margin-bottom: 4px; line-height: 1.2; letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }
        .card-subtitle {
            font-size: 0.75rem; color: #ccc; font-weight: 400;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            margin-bottom: 8px;
        }
        .card-price {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem; font-weight: 800; color: var(--primary);
            text-align: right; text-shadow: 0 0 15px rgba(0,0,0,1);
            padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* NAV & SORT */
        .list-view { display: none; }
        .list-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .nav-back-btn { display: flex; align-items: center; color: #fff; cursor: pointer; gap: 10px; }
        .nav-back-icon {
            width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
        }
        .sort-btn {
            background: transparent; border: 1px solid var(--border-glass); color: #aaa;
            padding: 6px 12px; border-radius: 50px; font-size: 0.75rem; cursor: pointer;
        }

        /* FOOTER BRANDING */
        .footer-branding {
            text-align: center; padding: 20px 10px 40px 10px; font-family: 'Outfit', sans-serif;
            font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); letter-spacing: 0.5px;
            margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); width: 90%; margin-left: auto; margin-right: auto;
        }
        .footer-branding span { color: var(--primary); font-weight: 700; }

        /* --- BOTTOM DOCK --- */
        .bottom-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 94%; max-width: 420px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; z-index: 999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer; color: #666; transition: 0.3s; flex: 1; padding: 5px 0;
        }
        .dock-item i { font-size: 1.3rem; margin-bottom: 4px; transition: 0.3s; }
        .dock-item span { font-size: 0.65rem; font-weight: 600; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px; }
        
        .dock-item:hover, .dock-item:active { color: #fff; }
        .dock-item:hover i { color: var(--primary); transform: translateY(-3px); }
        .dock-item.taxi i { color: #FFD700; }

        /* WIFI MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .modal-card {
            background: #181818; border: 1px solid rgba(255,255,255,0.1);
            width: 80%; max-width: 320px; padding: 30px; border-radius: 30px; text-align: center; position: relative;
        }
        .modal-icon { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .modal-title { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .modal-text { color: #fff; margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; background: #252525; padding: 12px; border-radius: 12px; font-family: 'Inter', sans-serif;}
        .close-modal { position: absolute; top: 20px; right: 20px; color: #666; cursor: pointer; font-size: 1.2rem; }
        .copy-btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; font-family: 'Outfit', sans-serif; font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- YÜKLEME EKRANI (SİSLİ & ORTALI) -->
    <div id="preloader">
        <video autoplay muted loop playsinline>
            <source src="https://res.cloudinary.com/douh5tbmk/video/upload/v1763962054/sm_logo_animasyon_bdso9x.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Header -->
    <header class="cinematic-header">
        <div class="brand-logo">Ertaş <span>Pide</span></div>
        <div class="header-actions">
            <button class="ctrl-btn" id="langBtn" onclick="toggleLang()">🇬🇧 EN</button>
            <button class="ctrl-btn active" id="currencyBtn" onclick="toggleCurrency()">₺</button>
            <button class="search-trigger" onclick="openSearch()">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

    <!-- Fullscreen Search Overlay -->
    <div id="searchOverlay" class="search-overlay">
        <div class="search-header">
            <button class="close-search" onclick="closeSearch()"><i class="fas fa-times"></i></button>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="Menüde ara...">
        <div id="searchResults" class="search-results-area grid-layout"></div>
    </div>

    <!-- Content -->
    <div class="content-area">
        
        <!-- Kategori Izgarası -->
        <div id="gridView" class="grid-layout"></div>

        <!-- Ürün Listesi -->
        <div id="listView" class="list-view">
            <div class="list-header-row">
                <div class="nav-back-btn" onclick="goBack()">
                    <div class="nav-back-icon"><i class="fas fa-arrow-left"></i></div>
                    <div>
                        <div style="font-size: 0.7rem; color: #888;">GERİ DÖN</div>
                        <div style="font-weight: 700;" id="pageTitle">KATEGORİ</div>
                    </div>
                </div>
                <button class="sort-btn" id="sortBtn" onclick="toggleSort()">
                    <i class="fas fa-sort"></i> <span id="sortText">Sırala</span>
                </button>
            </div>
            <div id="productsContainer" class="grid-layout"></div>
        </div>

        <!-- SOSYALMIND İMZASI (Dinamik Dilli) -->
        <div class="footer-branding">
            Bu İşletme <span>SosyalMind</span> tarafından hazırlanmıştır.
        </div>
    </div>

    <!-- BOTTOM DOCK -->
    <div class="bottom-dock">
        <button class="dock-item" onclick="openModal('wifiModal')"><i class="fas fa-wifi"></i> <span>Wi-Fi</span></button>
        <button class="dock-item" onclick="openMap()"><i class="fas fa-location-dot"></i> <span>Konum</span></button>
        <button class="dock-item taxi" onclick="callTaxi()"><i class="fas fa-taxi"></i> <span>Taksi</span></button>
        <button class="dock-item" onclick="shareMenu()"><i class="fas fa-share-nodes"></i> <span>Paylaş</span></button>
        <button class="dock-item" onclick="openInsta()"><i class="fab fa-instagram"></i> <span>Insta</span></button>
    </div>

    <!-- WIFI MODAL -->
    <div id="wifiModal" class="modal-overlay">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('wifiModal')"><i class="fas fa-times"></i></div>
            <div class="modal-icon"><i class="fas fa-wifi"></i></div>
            <div class="modal-title">Wi-Fi Şifresi</div>
            <div class="modal-text" id="wifiPassText">...</div>
            <button class="copy-btn" onclick="copyWifi()">Kopyala</button>
        </div>
    </div>

    <script>
        // --- SAĞ TIK ENGELLEME ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- AYARLAR ---
        const linkTL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrIczjBfOYYZlHTC17u2iLnfk1aki4U9VG-E66uxiOB0CtCPJYo_hYOdgxKLbvMl8o6cc_7eUuqr8A/pub?output=csv";
        const linkEUR = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRB3BKM6zo6iiU0Z9IwUYlPYNyT5R8oHC8tYT_LTGS2eOxkxebowYQoSWtBPMp8Q1HDZmcJPlvxWA4F/pub?output=csv";
        
        // !!! GÜNCELLE !!!
        const TAXI_NUMARASI = "+905320000000"; 
        const WIFI_SIFRE = "Ertas2024"; 
        const INSTAGRAM_LINK = "https://instagram.com/ertaspidekebap";
        const MAP_LINK = "https://maps.google.com/?q=Ertaş+Pide+Kebap+Salonu";

        let state = { lang: 'TR', currency: 'TL', data: [], grouped: {}, activeCat: null, view: 'grid', sortMode: 0 };
        
        // DİL AYARLARI (Footer eklendi)
        const ui = { 
            TR: { 
                searchPh: "Arama yapın...", back: "GERİ DÖN", unit: "ÇEŞİT", 
                langLabel: "🇬🇧 EN", 
                sort: ["Sırala", "En Düşük", "En Yüksek"],
                footer: "Bu İşletme <span>SosyalMind</span> tarafından hazırlanmıştır."
            }, 
            EN: { 
                searchPh: "Search...", back: "GO BACK", unit: "ITEMS", 
                langLabel: "🇹🇷 TR", 
                sort: ["Sort", "Lowest", "Highest"],
                footer: "This Business is prepared by <span>SosyalMind</span>."
            } 
        };

        // --- LOADER YÖNETİMİ ---
        function showLoading() { 
            const loader = document.getElementById('preloader');
            loader.classList.remove('loader-hidden');
            document.body.style.overflow = 'hidden'; 
        }
        
        function hideLoading() { 
            const loader = document.getElementById('preloader');
            setTimeout(() => { 
                loader.classList.add('loader-hidden');
                document.body.style.overflow = 'auto'; 
            }, 700); 
        }

        // --- INIT ---
        document.getElementById('wifiPassText').innerText = WIFI_SIFRE;

        document.addEventListener('DOMContentLoaded', () => {
            Promise.all([fetch(linkTL).then(r=>r.text()), fetch(linkEUR).then(r=>r.text())])
            .then(([csvTL, csvEUR]) => {
                state.data = mergeData(csvToObjects(csvTL), csvToObjects(csvEUR));
                groupData();
                renderGrid();
                hideLoading();
                updateUI();
            });
        });

        function mergeData(tl, eur) {
            return tl.map(item => {
                const clean = item.UrunAdi ? item.UrunAdi.trim().toLowerCase() : "";
                const match = eur.find(e => e.UrunAdi && e.UrunAdi.trim().toLowerCase() === clean);
                item.Fiyat_EUR = match ? match.Fiyat : ""; item.Fiyat_TL = item.Fiyat;
                return item;
            });
        }

        function groupData() {
            state.grouped = {};
            state.data.forEach(i => {
                if(!i.Kategori) return;
                if(!state.grouped[i.Kategori]) state.grouped[i.Kategori] = [];
                state.grouped[i.Kategori].push(i);
            });
        }

        function csvToObjects(csv) {
            const lines = csv.split("\n");
            const headers = lines[0].split(",").map(h => h.trim().replace(/[\r"]/g, ""));
            return lines.slice(1).map(line => {
                const data = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return headers.reduce((obj, nextKey, index) => {
                    obj[nextKey] = data[index] ? data[index].replace(/[\r"]/g, "") : "";
                    return obj;
                }, {});
            }).filter(row => row.Kategori);
        }

        // --- RENDER ---
        function createCard(title, subtitle, price, imgUrl, onClick) {
            const div = document.createElement('div');
            div.className = 'card-base';
            if(onClick) div.onclick = onClick;
            div.innerHTML = `
                <img src="${imgUrl}" class="card-img" loading="lazy">
                <div class="card-overlay">
                    <div class="card-title">${title}</div>
                    <div class="card-subtitle">${subtitle}</div>
                    ${price ? `<div class="card-price">${price}</div>` : ''}
                </div>
            `;
            return div;
        }

        function renderGrid() {
            const grid = document.getElementById('gridView');
            grid.innerHTML = "";
            Object.keys(state.grouped).forEach(key => {
                const items = state.grouped[key];
                let cover = "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80";
                const validImg = items.find(i => i.ResimLink && i.ResimLink.length > 15);
                if(validImg) cover = validImg.ResimLink;
                
                const name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : key;
                grid.appendChild(createCard(name, `${items.length} ${ui[state.lang].unit}`, null, cover, () => openCat(key)));
            });
        }

        function renderList(originalItems, containerId = 'productsContainer') {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            let items = [...originalItems];
            if (state.sortMode !== 0 && containerId !== 'searchResults') {
                items.sort((a, b) => {
                    let pA = state.currency === 'TL' ? parseFloat(a.Fiyat_TL) : parseFloat(a.Fiyat_EUR);
                    let pB = state.currency === 'TL' ? parseFloat(b.Fiyat_TL) : parseFloat(b.Fiyat_EUR);
                    if(isNaN(pA)) pA = -1; if(isNaN(pB)) pB = -1;
                    return state.sortMode === 1 ? pA - pB : pB - pA;
                });
            }
            if(!items.length) { container.innerHTML = "<div style='color:#777; width:200%; text-align:center'>Sonuç yok.</div>"; return; }
            items.forEach(i => {
                const name = (state.lang === 'EN' && i.UrunAdi_EN) ? i.UrunAdi_EN : i.UrunAdi;
                const desc = (state.lang === 'EN' && i.Aciklama_EN) ? i.Aciklama_EN : i.Aciklama;
                const price = state.currency === 'TL' ? (i.Fiyat_TL ? i.Fiyat_TL + ' ₺' : '') : (i.Fiyat_EUR ? i.Fiyat_EUR + ' €' : '');
                const img = (i.ResimLink && i.ResimLink.length > 15) ? i.ResimLink : "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80";
                container.appendChild(createCard(name, desc, price, img, null));
            });
        }

        // --- ACTIONS ---
        function toggleSearch() {
            const overlay = document.getElementById('searchOverlay');
            overlay.classList.toggle('active');
            if(overlay.classList.contains('active')) document.getElementById('searchInput').focus();
        }
        function openSearch() { toggleSearch(); }
        function closeSearch() { document.getElementById('searchOverlay').classList.remove('active'); document.getElementById('searchInput').value = ""; document.getElementById('searchResults').innerHTML = ""; }

        function openCat(key) {
            showLoading();
            setTimeout(() => {
                state.activeCat = key; state.view = 'list';
                document.getElementById('gridView').style.display = 'none';
                document.getElementById('listView').style.display = 'block';
                const items = state.grouped[key];
                const name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : key;
                document.getElementById('pageTitle').innerText = name;
                renderList(items);
                window.scrollTo(0,0);
                hideLoading();
            }, 500);
        }

        function goBack() {
            showLoading();
            setTimeout(() => {
                state.activeCat = null; state.view = 'grid';
                document.getElementById('listView').style.display = 'none';
                document.getElementById('gridView').style.display = 'grid';
                document.getElementById('searchInput').value = "";
                state.sortMode = 0; updateSortButton(); renderGrid();
                hideLoading();
            }, 500);
        }

        // --- DOCK FUNCTIONS ---
        function openMap() { window.open(MAP_LINK, '_blank'); }
        function openInsta() { window.open(INSTAGRAM_LINK, '_blank'); }
        function callTaxi() { window.location.href = "tel:" + TAXI_NUMARASI; }
        function shareMenu() { if (navigator.share) { navigator.share({ title: 'Ertaş Pide & Kebap', url: window.location.href }); } else { alert("Link: " + window.location.href); } }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function copyWifi() { navigator.clipboard.writeText(WIFI_SIFRE).then(() => { const btn = document.querySelector('.copy-btn'); btn.innerText = "Kopyalandı!"; btn.style.background = "#4CAF50"; setTimeout(() => { btn.innerText = "Kopyala"; btn.style.background = "var(--primary)"; }, 2000); }); }

        // --- UI ---
        function toggleSort() { state.sortMode = (state.sortMode + 1) % 3; updateSortButton(); if(state.view === 'list') renderList(state.grouped[state.activeCat]); }
        function updateSortButton() { document.getElementById('sortText').innerText = ui[state.lang].sort[state.sortMode]; }

        function toggleLang() { state.lang = state.lang === 'TR' ? 'EN' : 'TR'; showLoading(); setTimeout(() => { updateUI(); if(state.view==='list') openCat(state.activeCat); else renderGrid(); hideLoading(); }, 600); }
        function toggleCurrency() { state.currency = state.currency === 'TL' ? 'EUR' : 'TL'; showLoading(); setTimeout(() => { updateUI(); if(state.view==='list') openCat(state.activeCat); else renderGrid(); hideLoading(); }, 600); }

        function updateUI() {
            document.getElementById('langBtn').innerText = ui[state.lang].langLabel;
            document.getElementById('currencyBtn').innerText = state.currency === 'TL' ? '₺' : '€';
            document.getElementById('langBtn').classList.toggle('active', state.lang === 'EN');
            document.getElementById('currencyBtn').classList.toggle('active', state.currency === 'EUR');
            document.getElementById('searchInput').placeholder = ui[state.lang].searchPh;
            
            // FOOTER METNİNİ GÜNCELLE
            document.querySelector('.footer-branding').innerHTML = ui[state.lang].footer;
            
            updateSortButton();
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            if(!term) { document.getElementById('searchResults').innerHTML = ""; return; }
            const res = state.data.filter(i => {
                const all = `${i.UrunAdi} ${i.Aciklama} ${i.UrunAdi_EN || ''} ${i.Aciklama_EN || ''}`.toLowerCase();
                return all.includes(term);
            });
            renderList(res, 'searchResults');
        });
    </script>
</body>
</html>
