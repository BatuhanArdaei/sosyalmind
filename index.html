<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Menü | TL & EURO</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #d4af37;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-radius: 12px;
        }

        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Lato', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            padding-bottom: 50px;
        }
        
        /* Header ve Para Birimi Seçici */
        header { 
            text-align: center; 
            padding: 30px 20px 20px; 
            background: linear-gradient(to bottom, #000, #121212); 
            position: relative;
        }

        h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; font-size: 2.2rem; }
        p.subtitle { color: var(--text-sub); font-size: 0.8rem; margin-top: 5px; letter-spacing: 1px; text-transform: uppercase; }

        /* Para Birimi Butonları */
        .currency-switch {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .currency-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-sub);
            padding: 8px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .currency-btn.active {
            background-color: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Arama Kutusu */
        .search-wrapper { 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
            padding: 0 20px; 
            margin-top: 10px;
            margin-bottom: 20px; 
        }
        .search-box {
            background: #2a2a2a; 
            border: 1px solid #333; 
            border-radius: 50px; 
            display: flex; 
            align-items: center; 
            padding: 12px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            backdrop-filter: blur(5px);
        }
        .search-box input { 
            background: transparent; 
            border: none; 
            color: white; 
            width: 100%; 
            margin-left: 10px; 
            font-size: 1rem; 
            outline: none; 
        }
        .search-box i { color: var(--gold); }

        /* Menü İçeriği */
        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        
        .category-title {
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
            font-size: 1.5rem;
            margin: 30px 0 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 5px;
        }

        .menu-item {
            display: flex; 
            background: var(--card-bg); 
            border-radius: var(--border-radius); 
            margin-bottom: 15px; 
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
            transition: transform 0.2s;
        }
        
        .item-img { width: 110px; height: 110px; object-fit: cover; }
        
        .item-content { 
            padding: 12px 15px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
        }
        
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; color: #fff; }
        .item-desc { 
            font-size: 0.8rem; 
            color: var(--text-sub); 
            line-height: 1.3; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }
        
        .item-price { 
            color: var(--gold); 
            font-weight: 700; 
            font-size: 1.2rem; 
            text-align: right; 
            margin-top: auto; 
        }

        .hidden { display: none !important; }
        #loading { text-align: center; color: var(--gold); margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>Lusso Gusto</h1>
        <p class="subtitle">Premium Restaurant</p>
        
        <!-- Para Birimi Seçici -->
        <div class="currency-switch">
            <button class="currency-btn active" onclick="setCurrency('TL')">₺ Türk Lirası</button>
            <button class="currency-btn" onclick="setCurrency('EUR')">€ Euro</button>
        </div>
    </header>

    <div class="search-wrapper">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Menüde ara...">
        </div>
    </div>

    <div class="container">
        <div id="loading">Menü Yükleniyor...</div>
        <div id="menuArea"></div>
    </div>

    <script>
        // ==========================================================
        // AYARLAR (YÖNETİM KISMI)
        // ==========================================================
        
        const googleSheetLink = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQI6jJDMRSMA7PafphfEiqm4rwbyijvCE5n80MTqLYv9SqSSMpZfidyyIp-jBhWD1_BCN9dDKamwY6d/pub?output=csv";
        
        // 1 EURO kaç TL? (Burayı değiştirince tüm fiyatlar güncellenir)
        const EURO_KURU = 35; 

        // ==========================================================

        let globalMenuData = []; // Verileri hafızada tutmak için
        let currentCurrency = 'TL'; // Varsayılan para birimi

        document.addEventListener('DOMContentLoaded', () => {
            fetch(googleSheetLink)
                .then(res => res.text())
                .then(csvText => {
                    globalMenuData = csvToObjects(csvText);
                    renderMenu(globalMenuData); // İlk açılışta TL göster
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "Bağlantı Hatası: Lütfen internetinizi kontrol edin.";
                });
        });

        // Para Birimi Değiştirme Fonksiyonu
        function setCurrency(currency) {
            currentCurrency = currency;
            
            // Butonların renklerini güncelle
            const btns = document.querySelectorAll('.currency-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            
            if(currency === 'TL') btns[0].classList.add('active');
            else btns[1].classList.add('active');

            // Menüyü yeniden çiz (Yeni fiyatlarla)
            renderMenu(globalMenuData);
            
            // Eğer arama yapılmışsa filtreyi tekrar uygula
            const searchTerm = document.getElementById('searchInput').value;
            if(searchTerm.length > 0) {
                document.getElementById('searchInput').dispatchEvent(new Event('keyup'));
            }
        }

        // Menüyü Ekrana Basma
        function renderMenu(items) {
            const menuArea = document.getElementById('menuArea');
            menuArea.innerHTML = ""; // Önceki içeriği temizle

            const grouped = {};
            
            // Kategorilere ayır
            items.forEach(item => {
                if(!item.Kategori || item.Kategori.length < 2) return;
                if(!grouped[item.Kategori]) grouped[item.Kategori] = [];
                grouped[item.Kategori].push(item);
            });

            Object.keys(grouped).forEach(catName => {
                const section = document.createElement('div');
                section.className = 'category-section';
                
                let html = `<h2 class="category-title">${catName}</h2>`;
                
                grouped[catName].forEach(food => {
                    const img = (food.ResimLink && food.ResimLink.includes('http')) ? food.ResimLink : 'https://placehold.co/150x150/1e1e1e/d4af37?text=Lusso';
                    
                    // Fiyat Hesaplama
                    let displayPrice = "";
                    // Excel'den gelen "280 ₺" gibi yazıları temizleyip sayıya çeviriyoruz
                    let rawPrice = parseFloat(food.Fiyat.replace(/[^0-9,.]/g, '').replace(',', '.'));

                    if (isNaN(rawPrice)) rawPrice = 0;

                    if (currentCurrency === 'TL') {
                        displayPrice = rawPrice + " ₺";
                    } else {
                        // Euro hesaplama: Fiyat / Kur
                        let euroPrice = (rawPrice / EURO_KURU).toFixed(1); // Virgülden sonra 1 hane (Ör: 12.5)
                        // Sonu .0 ise sil (Ör: 12.0 -> 12)
                        displayPrice = euroPrice.replace('.0', '') + " €"; 
                    }

                    html += `
                    <div class="menu-item" data-search="${food.UrunAdi} ${food.Aciklama}">
                        <img src="${img}" class="item-img" loading="lazy">
                        <div class="item-content">
                            <div>
                                <div class="item-name">${food.UrunAdi}</div>
                                <div class="item-desc">${food.Aciklama}</div>
                            </div>
                            <div class="item-price">${displayPrice}</div>
                        </div>
                    </div>`;
                });
                section.innerHTML = html;
                menuArea.appendChild(section);
            });
        }

        // Arama Motoru
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.menu-item');
            const categories = document.querySelectorAll('.category-section');

            items.forEach(item => {
                const text = item.getAttribute('data-search').toLowerCase();
                if(text.includes(term)) item.classList.remove('hidden');
                else item.classList.add('hidden');
            });

            categories.forEach(cat => {
                const visibleItems = cat.querySelectorAll('.menu-item:not(.hidden)');
                if(visibleItems.length === 0) cat.classList.add('hidden');
                else cat.classList.remove('hidden');
            });
        });

        // CSV İşleyici
        function csvToObjects(csv) {
            const lines = csv.split("\n");
            const headers = lines[0].split(",").map(h => h.trim().replace(/[\r"]/g, ""));
            const result = [];
            for(let i=1; i<lines.length; i++){
                if(!lines[i]) continue;
                const currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const obj = {};
                headers.forEach((h, j) => {
                    obj[h] = currentline[j] ? currentline[j].replace(/[\r"]/g, "") : "";
                });
                result.push(obj);
            }
            return result;
        }
    </script>
</body>
</html>
