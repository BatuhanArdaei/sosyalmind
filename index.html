<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ertaş Pide & Kebap | Modern</title>
    
    <!-- YENİ FONT: OUTFIT (Başlıklar) & INTER (Metinler) - %100 Modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF3B3B; 
            --primary-dark: #D32F2F;
            
            --bg-deep: #050505;
            --surface: #121212;
            --surface-glass: rgba(18, 18, 18, 0.85);
            
            --text-white: #FFFFFF;
            --text-muted: #9CA3AF;
            
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 24px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-white);
            font-family: 'Inter', sans-serif; /* Okunabilir modern metin */
            overflow-x: hidden; 
            padding-bottom: 120px;
        }

        /* ARKA PLAN */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Temsili Dükkan Resmi */
            background-image: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover; background-position: center; opacity: 0.15; filter: blur(8px); z-index: -10;
        }

        /* HEADER */
        .cinematic-header {
            position: sticky; top: 0; z-index: 900; 
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 24px; border-bottom: 1px solid var(--border-glass);
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* Modern Logo Fontu */
        .brand-logo { 
            font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; 
            color: #fff; text-transform: uppercase; letter-spacing: -0.5px;
        }
        .brand-logo span { color: var(--primary); }

        .controls { display: flex; gap: 8px; }
        .ctrl-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); 
            color: var(--text-muted); padding: 8px 16px; border-radius: 12px; font-size: 0.8rem; 
            font-weight: 700; cursor: pointer; transition: 0.3s; font-family: 'Outfit', sans-serif;
        }
        .ctrl-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 15px rgba(255, 59, 59, 0.3); }

        .search-container { position: relative; }
        .search-input {
            width: 100%; background: #1A1A1A; border: 1px solid var(--border-glass);
            padding: 16px 20px 16px 50px; border-radius: 16px; color: #fff; font-size: 1rem; 
            font-family: 'Inter', sans-serif; outline: none; transition: 0.3s;
        }
        .search-input:focus { background: #222; border-color: var(--primary); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* CONTENT */
        .content-area { max-width: 900px; margin: 0 auto; padding: 20px; }
        #loading { text-align: center; margin-top: 60px; font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--primary); }

        /* GRID LAYOUT */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .card-base {
            position: relative; border-radius: var(--radius); overflow: hidden;
            cursor: pointer; border: 1px solid var(--border-glass);
            background: #111; aspect-ratio: 3 / 4; 
            display: flex; flex-direction: column; justify-content: flex-end;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-base:active { transform: scale(0.96); }

        .card-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: transform 0.6s ease; filter: brightness(0.8); z-index: 0;
        }
        .card-base:hover .card-img { transform: scale(1.05); filter: brightness(1); }

        .card-overlay {
            position: relative; z-index: 1;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            padding: 20px 15px; width: 100%;
        }

        .card-title {
            font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: #fff;
            margin-bottom: 4px; line-height: 1.1; letter-spacing: -0.5px;
        }
        .card-subtitle {
            font-size: 0.8rem; color: #ccc; font-weight: 400;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-price {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem; font-weight: 800; color: var(--primary);
            margin-top: 8px; text-align: right;
        }

        /* SIRALAMA */
        .sort-bar { display: none; justify-content: flex-end; margin-bottom: 15px; }
        .sort-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: #fff;
            padding: 8px 15px; border-radius: 50px; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif;
        }

        /* Nav Header */
        .list-view { display: none; animation: fadeUp 0.4s ease; }
        .nav-header { display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; }
        .nav-back-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff; margin-right: 15px; 
            border: 1px solid var(--border-glass); transition: 0.2s;
        }
        .nav-header:hover .nav-back-icon { background: var(--primary); border-color: var(--primary); }

        /* --- BOTTOM DOCK --- */
        .bottom-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 420px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; z-index: 9999;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .dock-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: none; border: none; cursor: pointer; color: #666;
            transition: 0.3s; flex: 1;
        }
        .dock-item i { font-size: 1.4rem; margin-bottom: 4px; transition: 0.3s; }
        .dock-item span { font-size: 0.65rem; font-weight: 600; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px; }
        
        .dock-item:hover, .dock-item:active { color: #fff; }
        .dock-item:hover i { color: var(--primary); transform: translateY(-3px); }

        /* TAXI BUTTON SPECIAL STYLE */
        .dock-item.taxi i { 
            color: #FFD700; /* Taksi Sarısı */
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .modal-card {
            background: #181818; border: 1px solid rgba(255,255,255,0.1);
            width: 80%; max-width: 320px; padding: 30px; border-radius: 30px;
            text-align: center; position: relative;
        }
        .modal-icon { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .modal-title { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .modal-text { color: #fff; margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; background: #252525; padding: 12px; border-radius: 12px; font-family: 'Inter', sans-serif; letter-spacing: 1px;}
        .close-modal { position: absolute; top: 20px; right: 20px; color: #666; cursor: pointer; font-size: 1.2rem; }
        .copy-btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; font-family: 'Outfit', sans-serif; font-size: 1rem;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 400px) { .grid-layout { grid-template-columns: 1fr; } .card-base { aspect-ratio: 21 / 10; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="cinematic-header">
        <div class="header-row">
            <div class="brand-logo">Ertaş <span>Pide</span></div>
            <div class="controls">
                <button class="ctrl-btn" id="langBtn" onclick="toggleLang()">TR</button>
                <button class="ctrl-btn" id="currencyBtn" onclick="toggleCurrency()">₺</button>
            </div>
        </div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Menüde arama yapın...">
        </div>
    </header>

    <!-- Content -->
    <div class="content-area">
        <div id="loading">YÜKLENİYOR...</div>

        <!-- Kategoriler -->
        <div id="gridView" class="grid-layout"></div>

        <!-- Ürün Listesi -->
        <div id="listView" class="list-view">
            <div class="nav-header" onclick="goBack()">
                <div class="nav-back-icon"><i class="fas fa-arrow-left"></i></div>
                <div>
                    <div style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600;" id="backText">GERİ DÖN</div>
                    <div style="font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800;" id="pageTitle">KATEGORİ</div>
                </div>
            </div>

            <div class="sort-bar" id="sortControl" style="display: flex;">
                <button class="sort-btn" onclick="toggleSort()">
                    <i class="fas fa-sort"></i> <span id="sortText">Sıralama: Varsayılan</span>
                </button>
            </div>

            <div id="productsContainer" class="grid-layout"></div>
        </div>
    </div>

    <!-- ALT DOCK MENÜ -->
    <div class="bottom-dock">
        <!-- Wi-Fi -->
        <button class="dock-item" onclick="openModal('wifiModal')">
            <i class="fas fa-wifi"></i> <span>Wi-Fi</span>
        </button>
        <!-- Konum -->
        <button class="dock-item" onclick="openMap()">
            <i class="fas fa-location-dot"></i> <span>Konum</span>
        </button>
        
        <!-- TAKSİ BUTONU (YENİ) -->
        <button class="dock-item taxi" onclick="callTaxi()">
            <i class="fas fa-taxi"></i> <span>Taksi</span>
        </button>
        
        <!-- Paylaş -->
        <button class="dock-item" onclick="shareMenu()">
            <i class="fas fa-share-nodes"></i> <span>Paylaş</span>
        </button>
        <!-- Instagram -->
        <button class="dock-item" onclick="openInsta()">
            <i class="fab fa-instagram"></i> <span>Insta</span>
        </button>
    </div>

    <!-- WIFI POPUP -->
    <div id="wifiModal" class="modal-overlay">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('wifiModal')"><i class="fas fa-times"></i></div>
            <div class="modal-icon"><i class="fas fa-wifi"></i></div>
            <div class="modal-title">Wi-Fi Şifresi</div>
            <div class="modal-text" id="wifiPassText">...</div>
            <button class="copy-btn" onclick="copyWifi()">Kopyala</button>
        </div>
    </div>

    <script>
        // --- AYARLAR ---
        const linkTL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrIczjBfOYYZlHTC17u2iLnfk1aki4U9VG-E66uxiOB0CtCPJYo_hYOdgxKLbvMl8o6cc_7eUuqr8A/pub?output=csv";
        const linkEUR = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRB3BKM6zo6iiU0Z9IwUYlPYNyT5R8oHC8tYT_LTGS2eOxkxebowYQoSWtBPMp8Q1HDZmcJPlvxWA4F/pub?output=csv";
        
        // !!! BİLGİLERİ GÜNCELLE !!!
        const TAXI_NUMARASI = "+905320000000"; // Taksi Durağı veya Şahıs Numarası (Başında +90 olsun)
        const WIFI_SIFRE = "Ertas2024"; 
        const INSTAGRAM_LINK = "https://instagram.com/ertaspidekebap";
        const MAP_LINK = "https://maps.google.com/?q=Ertaş+Pide+Kebap+Salonu";

        let state = { lang: 'TR', currency: 'TL', data: [], grouped: {}, activeCat: null, view: 'grid', sortMode: 0 };
        const ui = { 
            TR: { search: "Arama...", back: "GERİ DÖN", unit: "ÇEŞİT", sort: ["Sıralama: Varsayılan", "Sıralama: Artan Fiyat", "Sıralama: Azalan Fiyat"] }, 
            EN: { search: "Search...", back: "GO BACK", unit: "ITEMS", sort: ["Sort: Default", "Sort: Low to High", "Sort: High to Low"] } 
        };

        // --- INIT ---
        document.getElementById('wifiPassText').innerText = WIFI_SIFRE;

        document.addEventListener('DOMContentLoaded', () => {
            Promise.all([fetch(linkTL).then(r=>r.text()), fetch(linkEUR).then(r=>r.text())])
            .then(([csvTL, csvEUR]) => {
                state.data = mergeData(csvToObjects(csvTL), csvToObjects(csvEUR));
                groupData();
                renderGrid();
                document.getElementById('loading').style.display = 'none';
                updateUI();
            });
        });

        function mergeData(tl, eur) {
            return tl.map(item => {
                const clean = item.UrunAdi ? item.UrunAdi.trim().toLowerCase() : "";
                const match = eur.find(e => e.UrunAdi && e.UrunAdi.trim().toLowerCase() === clean);
                item.Fiyat_EUR = match ? match.Fiyat : ""; item.Fiyat_TL = item.Fiyat;
                return item;
            });
        }

        function groupData() {
            state.grouped = {};
            state.data.forEach(i => {
                if(!i.Kategori) return;
                if(!state.grouped[i.Kategori]) state.grouped[i.Kategori] = [];
                state.grouped[i.Kategori].push(i);
            });
        }

        function csvToObjects(csv) {
            const lines = csv.split("\n");
            const headers = lines[0].split(",").map(h => h.trim().replace(/[\r"]/g, ""));
            return lines.slice(1).map(line => {
                const data = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return headers.reduce((obj, nextKey, index) => {
                    obj[nextKey] = data[index] ? data[index].replace(/[\r"]/g, "") : "";
                    return obj;
                }, {});
            }).filter(row => row.Kategori);
        }

        // --- RENDER ---
        function renderGrid() {
            const grid = document.getElementById('gridView');
            grid.innerHTML = "";
            Object.keys(state.grouped).forEach(key => {
                const items = state.grouped[key];
                let cover = "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80";
                const validImg = items.find(i => i.ResimLink && i.ResimLink.length > 15);
                if(validImg) cover = validImg.ResimLink;
                
                const name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : key;

                const card = document.createElement('div');
                card.className = 'card-base';
                card.onclick = () => openCat(key);
                card.innerHTML = `
                    <img src="${cover}" class="card-img" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-title">${name}</div>
                        <div class="card-subtitle">${items.length} ${ui[state.lang].unit}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderList(originalItems) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = "";
            
            // Sıralama
            let items = [...originalItems];
            if (state.sortMode !== 0) {
                items.sort((a, b) => {
                    let pA = state.currency === 'TL' ? parseFloat(a.Fiyat_TL) : parseFloat(a.Fiyat_EUR);
                    let pB = state.currency === 'TL' ? parseFloat(b.Fiyat_TL) : parseFloat(b.Fiyat_EUR);
                    if(isNaN(pA)) pA = -1; if(isNaN(pB)) pB = -1;
                    return state.sortMode === 1 ? pA - pB : pB - pA;
                });
            }

            if(!items.length) { container.innerHTML = "<div style='color:#777; width:200%; text-align:center'>Sonuç yok.</div>"; return; }

            items.forEach(i => {
                const name = (state.lang === 'EN' && i.UrunAdi_EN) ? i.UrunAdi_EN : i.UrunAdi;
                const desc = (state.lang === 'EN' && i.Aciklama_EN) ? i.Aciklama_EN : i.Aciklama;
                const price = state.currency === 'TL' ? (i.Fiyat_TL ? i.Fiyat_TL + ' ₺' : '') : (i.Fiyat_EUR ? i.Fiyat_EUR + ' €' : '');
                const img = (i.ResimLink && i.ResimLink.length > 15) ? i.ResimLink : "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80";

                const el = document.createElement('div');
                el.className = 'card-base';
                el.innerHTML = `
                    <img src="${img}" class="card-img" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-title">${name}</div>
                        <div class="card-subtitle" style="-webkit-line-clamp: 2;">${desc}</div>
                        <div class="card-price">${price}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // --- ACTIONS ---
        function openCat(key) {
            state.activeCat = key; state.view = 'list';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.querySelector('.sort-bar').style.display = 'flex';
            
            const items = state.grouped[key];
            const name = (state.lang === 'EN' && items[0].Kategori_EN) ? items[0].Kategori_EN : key;
            document.getElementById('pageTitle').innerText = name;
            
            renderList(items);
            window.scrollTo(0,0);
            document.getElementById('searchInput').value = "";
        }

        function goBack() {
            state.activeCat = null; state.view = 'grid';
            document.getElementById('listView').style.display = 'none';
            document.getElementById('gridView').style.display = 'grid';
            document.querySelector('.sort-bar').style.display = 'none';
            document.getElementById('searchInput').value = "";
            state.sortMode = 0; updateSortButton(); renderGrid();
        }

        // --- DOCK FUNCTIONS ---
        function openMap() { window.open(MAP_LINK, '_blank'); }
        function openInsta() { window.open(INSTAGRAM_LINK, '_blank'); }
        function callTaxi() { window.location.href = "tel:" + TAXI_NUMARASI; } // TAKSİ ARAMA
        
        function shareMenu() {
            if (navigator.share) {
                navigator.share({ title: 'Ertaş Pide & Kebap', url: window.location.href }).catch(console.error);
            } else { alert("Link: " + window.location.href); }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function copyWifi() {
            navigator.clipboard.writeText(WIFI_SIFRE).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "Kopyalandı!"; btn.style.background = "#4CAF50";
                setTimeout(() => { btn.innerText = "Kopyala"; btn.style.background = "var(--primary)"; }, 2000);
            });
        }

        function toggleSort() {
            state.sortMode = (state.sortMode + 1) % 3;
            updateSortButton();
            if (state.view === 'list' && state.activeCat) renderList(state.grouped[state.activeCat]);
            else if (state.view === 'search') document.getElementById('searchInput').dispatchEvent(new Event('keyup'));
        }

        function updateSortButton() {
            document.getElementById('sortText').innerText = ui[state.lang].sort[state.sortMode];
            const icon = document.querySelector('.sort-btn i');
            icon.className = state.sortMode === 0 ? "fas fa-sort" : (state.sortMode === 1 ? "fas fa-sort-amount-down-alt" : "fas fa-sort-amount-down");
        }

        function toggleLang() { state.lang = state.lang === 'TR' ? 'EN' : 'TR'; updateUI(); if(state.view==='list') openCat(state.activeCat); else renderGrid(); }
        function toggleCurrency() { state.currency = state.currency === 'TL' ? 'EUR' : 'TL'; updateUI(); if(state.view==='list') openCat(state.activeCat); else renderGrid(); }

        function updateUI() {
            document.getElementById('langBtn').innerText = state.lang;
            document.getElementById('currencyBtn').innerText = state.currency === 'TL' ? '₺' : '€';
            document.getElementById('langBtn').classList.toggle('active', state.lang === 'EN');
            document.getElementById('currencyBtn').classList.toggle('active', state.currency === 'EUR');
            document.getElementById('searchInput').placeholder = ui[state.lang].search;
            document.getElementById('backText').innerText = ui[state.lang].back;
            updateSortButton();
        }

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            if(!term) { state.activeCat ? openCat(state.activeCat) : goBack(); return; }
            state.view = 'search';
            document.getElementById('gridView').style.display = 'none';
            document.getElementById('listView').style.display = 'block';
            document.querySelector('.sort-bar').style.display = 'flex';
            document.getElementById('pageTitle').innerText = state.lang === 'TR' ? "SONUÇLAR" : "RESULTS";
            
            const res = state.data.filter(i => {
                const all = `${i.UrunAdi} ${i.Aciklama} ${i.UrunAdi_EN || ''} ${i.Aciklama_EN || ''}`.toLowerCase();
                return all.includes(term);
            });
            renderList(res);
        });
    </script>
</body>
</html>
